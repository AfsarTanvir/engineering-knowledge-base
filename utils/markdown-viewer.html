<!DOCTYPE html>
<html>
<head>
  <title>Markdown Viewer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
      color: #333;
    }
    .viewer-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
    }
    .file-path {
      color: #666;
      font-size: 12px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    pre {
      background: #f5f5f5;
      padding: 1em;
      padding-top: 40px;
      overflow-x: auto;
      border-radius: 4px;
      position: relative;
      border-left: 3px solid #007bff;
    }
    code {
      font-family: 'Courier New', monospace;
      font-size: 14px;
    }
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 6px 12px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 12px;
      border-radius: 4px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .copy-btn:hover {
      background: #0056b3;
    }
    .copy-btn:active {
      background: #004085;
    }
    h1, h2, h3 {
      color: #222;
    }
    a {
      color: #007bff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .error {
      color: #d32f2f;
      padding: 15px;
      background: #ffebee;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="viewer-container">
    <div class="file-path" id="file-path"></div>
    <div id="markdown-content"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script type="module">
    import { addCopyButtonsToCodeBlocks } from './clipboard.js';

    function getMarkdownFilePath() {
      const params = new URLSearchParams(window.location.search);
      return params.get('file') || '../databases/query-optimization/slow-query-fixes.md';
    }

    const filePath = getMarkdownFilePath();
    document.getElementById('file-path').textContent = `📄 ${filePath}`;

    fetch(filePath)
      .then(res => {
        if (!res.ok) throw new Error(`File not found: ${filePath}`);
        return res.text();
      })
      .then(markdown => {
        document.getElementById('markdown-content').innerHTML = marked.parse(markdown);
        addCopyButtonsToCodeBlocks(document, {
          buttonText: 'Copy',
          successText: '✓ Copied!',
          successDuration: 2000
        });
      })
      .catch(err => {
        document.getElementById('markdown-content').innerHTML = `<div class="error">⚠️ ${err.message}</div>`;
      });
  </script>
</body>
</html>
